name: Rizz.AI build checks

# Builds only. AWS publishing and GitOps delivery are separate workflows.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rizz-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            rizz-app/package-lock.json
      - name: Backend tests and dependency gate
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=high
      - name: Frontend tests, build and dependency gate
        working-directory: rizz-app
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Build both images and run explicit mock-only integration
        run: |
          docker compose -p rizz-phase2-ci -f compose.local.yaml -f compose.smoke.yaml up --build -d --wait --wait-timeout 60
          node scripts/smoke.mjs
      - name: Scan both local images (fail on HIGH or CRITICAL)
        run: |
          mkdir -p reports
          scan_exit_code=0
          for component in frontend backend; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD/reports:/reports" \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "/reports/$component.json" "rizz-$component:phase1-local" || scan_exit_code=1
          done
          exit "$scan_exit_code"
      - name: Preserve scan evidence (not a deployable release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this CI smoke stack
        if: always()
        run: docker compose -p rizz-phase2-ci -f compose.local.yaml -f compose.smoke.yaml down
