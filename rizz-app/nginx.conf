server {
    listen 8080;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Browser receives the backend's Basic challenge before loading the app.
    # HTTPS is mandatory when exposing this demo beyond localhost.
    location = /_demo_auth {
        internal;
        proxy_pass http://rizz-backend-service:3000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }
    location = /readyz {
        access_log off;
        proxy_pass http://rizz-backend-service:3000/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /metrics {
        return 404;
    }
    
    location / {
        auth_request /_demo_auth;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        auth_request /_demo_auth;
        proxy_pass http://rizz-backend-service:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 32s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
