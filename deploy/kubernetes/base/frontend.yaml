apiVersion: apps/v1
kind: Deployment
metadata:
  name: rizz-frontend
  labels:
    app.kubernetes.io/name: rizz-frontend
    app.kubernetes.io/part-of: rizz-ai
    backstage.io/kubernetes-id: rizz-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rizz-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rizz-frontend
        app.kubernetes.io/part-of: rizz-ai
        backstage.io/kubernetes-id: rizz-frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Rendering-only placeholder. Never apply before release digest resolution.
          image: rizz-frontend:release-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: [nginx, -s, quit]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rizz-frontend-service
  labels:
    backstage.io/kubernetes-id: rizz-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rizz-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
